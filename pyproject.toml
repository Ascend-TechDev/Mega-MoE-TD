[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mega-moe-td"
version = "0.2.0"
description = "Ascend Triton distributed Mega-MoE forward and backward operators"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "dist: requires a multi-rank Ascend HCCL/ACLSHMEM run",
    "npu: requires an Ascend NPU device",
    "functional: functional correctness suite",
    "performance: performance benchmark suite",
    "forward: forward-direction case",
    "backward: backward-direction case",
    "smoke: small/quick representative case",
    "slow: large or otherwise expensive case",
    "kimi: Kimi model case",
    "trimmed: reduced expert-topology projection case",
    "dsv4: DSV4 model case",
]
